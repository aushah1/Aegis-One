<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Aegis One Liquid glass wallpaper (light): soft color bands for the glass to show through. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4fa"/><stop offset="1" stop-color="#e6eaf4"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b92ff"/><stop offset=".6" stop-color="#8f86ff"/><stop offset="1" stop-color="#b38cff"/></linearGradient>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3fcdb6"/><stop offset="1" stop-color="#6aa8ff"/></linearGradient>
    <radialGradient id="c"><stop offset="0" stop-color="#ffa477"/><stop offset="1" stop-color="#ffb08a" stop-opacity="0"/></radialGradient>
    <radialGradient id="d"><stop offset="0" stop-color="#f59ad0"/><stop offset="1" stop-color="#f59ad0" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g filter="url(#soft)">
    <path d="M-120 250 C 240 60 520 400 880 230 S 1450 40 1720 190 L 1720 420 C 1400 290 1180 560 860 500 S 260 330 -120 540 Z" fill="url(#a)" opacity=".6"/>
    <path d="M-120 780 C 280 610 640 880 980 730 S 1500 560 1720 650 L 1720 1120 L -120 1120 Z" fill="url(#b)" opacity=".5"/>
    <ellipse cx="1340" cy="150" rx="330" ry="210" fill="url(#c)" opacity=".85"/>
    <ellipse cx="760" cy="600" rx="300" ry="170" fill="url(#d)" opacity=".45"/>
    <ellipse cx="180" cy="760" rx="260" ry="180" fill="#7fb6ff" opacity=".35"/>
  </g>
</svg>
